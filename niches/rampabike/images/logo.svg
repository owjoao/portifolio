<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rampaOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Orange Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#rampaOrangeGrad)" />

  <!-- Rounded White Triangle Container -->
  <path d="M 150 48 
           C 158 48, 168 58, 174 68 
           L 248 186 
           C 255 198, 252 216, 238 224 
           C 230 228, 222 230, 214 230 
           L 86 230 
           C 68 230, 52 216, 50 198 
           C 48 190, 52 180, 58 170 
           L 126 68 
           C 132 58, 142 48, 150 48 Z" 
        fill="#FFFFFF" 
        filter="url(#logoShadow)" />

  <!-- Cyclist & Bicycle Graphic (Orange #EA580C) -->
  <g fill="none" stroke="#EA580C" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Helmet / Head & Cap Flag -->
    <polygon points="144,98 156,92 148,104" fill="#EA580C" stroke="none" />
    <circle cx="148" cy="100" r="4" fill="#EA580C" stroke="none" />

    <!-- Cyclist Body & Arms & Frame -->
    <!-- Torso leaning forward -->
    <path d="M147 104 L138 126 L170 120 L154 135 L190 156" stroke-width="4.5" />
    <!-- Front Fork to Handlebar -->
    <path d="M136 128 L128 152" stroke-width="4.5" />
    <!-- Rear stay to rear axle -->
    <path d="M154 135 L190 156" stroke-width="4.5" />
    <!-- Bottom bracket to crank -->
    <path d="M138 126 L154 135" stroke-width="4.5" />
    
    <!-- Front Wheel (Left in movement or Right depending on angle) -->
    <circle cx="124" cy="154" r="17" stroke-width="4.2" />
    <!-- Rear Wheel -->
    <circle cx="190" cy="156" r="17" stroke-width="4.2" />
  </g>

  <!-- Typography: RAMPABIKE (Stylized Bold Track Lettering) -->
  <g fill="#EA580C">
    <!-- Stylized hand-drawn sport font recreation -->
    <text x="150" y="208" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="28" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="1.5">
      RAMPABIKE
    </text>
    <!-- Subtitle MOTOS & BIKES -->
    <text x="150" y="222" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="8.5" 
          font-weight="800" 
          letter-spacing="2" 
          opacity="0.85">
      DESDE 1994
    </text>
  </g>
</svg>
